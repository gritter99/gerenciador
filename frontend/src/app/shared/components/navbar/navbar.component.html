<nav class="bg-white shadow-md">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between h-16">
      <!-- Logo -->
      <div class="flex items-center">
        <a routerLink="/dashboard" class="flex items-center">
          <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z">
            </path>
          </svg>
          <span class="ml-2 text-xl font-bold text-gray-800">Gerenciador</span>
        </a>
      </div>

      <!-- Navigation Links -->
      <div class="flex items-center space-x-4">
        <a routerLink="/dashboard" routerLinkActive="bg-blue-100 text-blue-700"
          [routerLinkActiveOptions]="{exact: true}"
          class="px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-colors">
          Dashboard
        </a>
        <a routerLink="/transacoes" routerLinkActive="bg-blue-100 text-blue-700"
          class="px-3 py-2 rounded-md text-sm font-medium text-gray-600 hover:text-gray-900 hover:bg-gray-100 transition-colors">
          Transações
        </a>
      </div>

      <!-- User Menu -->
      <div class="flex items-center">
        @if (authService.currentUser()) {
        <span class="text-sm text-gray-600 mr-4">
          {{ authService.currentUser()?.nome }}
        </span>
        }
        <button (click)="logout()"
          class="inline-flex items-center px-3 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition-colors">
          <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          Sair
        </button>
      </div>
    </div>
  </div>
</nav>
